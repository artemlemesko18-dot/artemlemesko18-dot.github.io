# Автопубликация на GitHub Pages: при каждом изменении в ветке main
# сайт пересобирается и выкладывается сам (вкладка Actions показывает ход сборки).
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      # Ссылки сайта рассчитаны на корень домена: https://ЛОГИН.github.io/ или свой домен
      - name: Проверка адреса сайта
        if: steps.pages.outputs.base_path != ''
        run: |
          echo "::error::Сайт должен открываться с корня домена. Назовите репозиторий ЛОГИН.github.io (сейчас адрес ${{ steps.pages.outputs.base_url }}) или подключите свой домен в Settings → Pages."
          exit 1
      - run: npm ci
      - run: npm run test:search
      - run: npm run build
        env:
          STATIC_HOSTING: '1'
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          ASTRO_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
